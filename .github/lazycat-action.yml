version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: feedlore

build:
  toolchains: []
  run_buildscript: false

images:
  - id: feedlore
    target: service
    service: app
    source: ghcr.io/chensnails/feedlore
    channel: stable
    sort: semver
    tag_regex: '^\d+\.\d+\.\d+$'
    max_tags: 50000
    max_matching_tags: 50000
    delivery:
      mode: mirror
      require_digest_match: true
  - id: feedlore-db
    target: service
    service: db
    source: docker.io/library/postgres
    channel: stable
    sort: semver
    tag_regex: '^18\.\d+-alpine$'
    version_regex: '^(?P<version>18\.\d+)-alpine$'
    version_template: '{version}.0'
    max_tags: 50000
    max_matching_tags: 50000
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: 笺川
    summary: 自托管 RSS 阅读器与资源卡片墙
